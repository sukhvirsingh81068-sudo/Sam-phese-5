name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: unzip -q SAM-android-phase1.zip
      - run: cd SAM && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SAM-debug-apk
          path: SAM/app/build/outputs/apk/debug/app-debug.apk
